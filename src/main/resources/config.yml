pack:
  bind-address: 127.0.0.1
  port: 25585
  public-url: http://127.0.0.1:25585/dui.zip
videos:
  live: true

browser:
  mouse-controls: true
  # pixels-per-degree: 14.22 (defaults to viewport width / 90)
  home: https://www.youtube.com/
  node: node
  # runtime: /absolute/path/to/browser/runtime (defaults to plugins/dui-demo/browser/runtime)
  maximum-sessions: 2
  width: 1280
  height: 720
  fps: 12
  zoom: 100 # 50..250 percent; adjustable per session from the control menu
  format: BGR555
  bytes-per-second: 67108864

gba:
  maximum-sessions: 2
  bytes-per-second: 16777216

media:
  # RGB888 = full 24-bit color. BGR555 = 15-bit color with about half as many maps.
  format: RGB888
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  maximum-sessions: 2
  width: 384
  fps: 30
  bytes-per-second: 16777216
