<!-- Aster is an ordinary DUI consumer: appearance resources + public components. -->
<dui-menu width="{{width}}" height="{{height}}" motion="{{motion}}">
 <dui-style id="metal" fill="#202A32" border="#89724C" highlight="#BCA77B" color="#EEDDB6" bevel="1" />
 <dui-style id="gold" fill="#B18B4D" border="#664E2C" highlight="#EAD09B" color="#15212A" bevel="1" />
 <dui-layer height="fill">
  <dui-image id="character_bg" source="character_background" width="fill" height="fill" pixel-size="{{pixel}}" image-layer="background" />
  <dui-text x="12" y="9" width="174" height="9" label="ASTER / CHARACTER" color="#EED3A0" />
  <dui-button class="metal" id="character_motion" action="character_motion" x="{{navX}}" y="0" width="54" height="18" label="{{motionLabel}}" />
  <dui-button class="metal" id="character_size" action="character_size" x="{{sizeX}}" y="0" width="54" height="18" label="{{sizeLabel}}" />
  <dui-text x="12" y="27" width="180" height="9" label="{{name}}" color="#BBCAA9" />
  <dui-player-model id="character" source="viewer" x="{{modelX}}" y="{{modelY}}" width="{{modelW}}" height="{{modelH}}" facing="{{facing}}" outer-layer="true" idle="{{motion}}" />
  <dui-repeat items="slots" as="s">
   <dui-button id="slot_{{s.id}}" action="character_slot" payload="{{s.id}}" x="{{s.x}}" y="{{s.y}}" width="{{s.size}}" height="{{s.size}}" label="" fill="#16212B" border="{{s.color}}" highlight="{{s.color}}" bevel="1" tooltip="{{s.tooltip}}" />
   <dui-if test="{{s.empty}}"><dui-text x="{{s.x}}" y="{{s.y}}" width="{{s.size}}" height="{{s.size}}" label="{{s.letter}}" align="center" color="#897B62" /></dui-if>
   <dui-if test="{{s.equipped}}"><dui-item id="slot_{{s.id}}" x="{{s.ix}}" y="{{s.iy}}" width="{{s.iconSize}}" height="{{s.iconSize}}" size="{{s.iconSize}}" /></dui-if>
   <dui-if test="{{s.equipped}}"><dui-progress x="{{s.x}}" y="{{s.barY}}" width="{{s.size}}" height="9" value="{{s.durability}}" /></dui-if>
  </dui-repeat>
  <dui-button class="metal" id="character_left" action="character_turn" payload="-1" x="{{turnX}}" y="{{turnY}}" width="27" height="18" label="&lt;" />
  <dui-button class="metal" id="character_right" action="character_turn" payload="1" x="{{turnRightX}}" y="{{turnY}}" width="27" height="18" anchor-x="left" label="&gt;" />
  <dui-layer x="{{statsX}}" y="0" width="{{statsW}}" height="fill">
   <dui-text y="27" width="fill" height="9" label="ATTRIBUTES" color="#EACB8F" />
   <dui-repeat items="stats" as="s"><dui-text x="0" y="{{s.y}}" width="fill" height="9" label="{{s.label}} / {{s.value}}" color="#DBDBCB" /></dui-repeat>
   <dui-if test="{{wide}}"><dui-text x="0" y="270" width="fill" height="18" label="Vanilla equipment.
Real inventory." color="#9DA7A9" /></dui-if>
  </dui-layer>
  <dui-text x="8" y="{{statusY}}" width="fill" height="9" label="{{status}}" color="#B8AD90" align="center" />
  <dui-if test="{{popup}}"><dui-layer id="equipment_picker" x="{{pickerX}}" y="{{pickerY}}" width="{{pickerW}}" height="{{pickerH}}" cover="true" dismiss="character_dismiss">
   <dui-surface width="fill" height="fill" fill="#17222D" border="#D9B571" bevel="2" />
   <dui-text x="6" y="0" width="fill" height="18" label="{{pickerTitle}}" color="#F3D39C" />
   <dui-if test="{{empty}}"><dui-text x="6" y="27" width="fill" height="27" wrap="true" label="No matching inventory items." color="#ACAFAF" /></dui-if>
   <dui-repeat items="candidates" as="item">
    <dui-button id="candidate_{{item.index}}" action="character_equip" payload="{{item.index}}" x="4" y="{{item.y}}" width="fill" height="27" label="" fill="#202E3A" border="{{item.color}}" bevel="1" tooltip="{{item.tooltip}}" />
    <dui-item id="candidate_{{item.index}}" x="6" y="{{item.y}}" width="{{item.icon}}" height="{{item.icon}}" size="{{item.icon}}" />
    <dui-text x="36" y="{{item.y}}" width="fill" height="27" label="{{item.name}}" wrap="true" max-lines="2" color="{{item.color}}" />
   </dui-repeat>
   <dui-button class="gold" id="character_unequip" action="character_unequip" x="4" y="{{unequipY}}" width="fill" height="18" label="Unequip" />
   <dui-button class="metal" id="character_previous" action="character_page" payload="-1" x="4" y="{{pagerY}}" width="24" height="18" label="&lt;" locked="{{prevLocked}}" />
   <dui-text x="30" y="{{pagerY}}" width="54" height="18" label="{{pageLabel}}" align="center" color="#DED4B8" />
   <dui-button class="metal" id="character_next" action="character_page" payload="1" x="4" anchor-x="right" y="{{pagerY}}" width="24" height="18" label="&gt;" locked="{{nextLocked}}" />
  </dui-layer></dui-if>
 </dui-layer>
</dui-menu>
