<dui-hud native-hud="cover" native-hud-color="#101D28">
  <dui-surface anchor-y="top" offset-y="6" opacity="0.78">
    <dui-menu width="440" height="36"><dui-layer><dui-rect width="fill" height="fill" fill="#101D28"/></dui-layer></dui-menu>
  </dui-surface>
  <dui-surface anchor-y="top" offset-y="6">
    <dui-menu width="440" height="36"><dui-layer>
      <dui-text x="6" y="0" width="428" height="18" label="{{title}}" align="center" color="#F5E3B8"/>
      <dui-progress x="150" y="24" width="140" height="9" value="{{progress}}" max="1" color="#E4C888"/>
    </dui-layer></dui-menu>
  </dui-surface>
  <dui-surface anchor-y="bottom" offset-y="-3" opacity="0.78">
    <dui-menu width="440" height="54"><dui-layer><dui-rect width="fill" height="fill" fill="#101D28"/></dui-layer></dui-menu>
  </dui-surface>
  <dui-surface anchor-y="bottom" offset-y="-3">
    <dui-menu width="440" height="54"><dui-layer><dui-row x="6" y="0" width="428" height="36" gap="6">
      <dui-repeat items="controls" as="control"><dui-layer height="36">
        <dui-icon x="2" y="9" width="9" height="9" name="{{control.icon}}" color="#8ED6C9"/>
        <dui-text x="17" y="6" width="fill" height="18" label="{{control.label}}" color="#F5E3B8"/>
        <dui-text x="2" y="24" width="fill" height="9" label="{{control.hint}}" color="#9CBFC2"/>
      </dui-layer></dui-repeat>
    </dui-row></dui-layer></dui-menu>
  </dui-surface>
</dui-hud>
