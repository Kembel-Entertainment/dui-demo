<dui-menu width="{{width}}" height="{{height}}" animation-start="{{startedAt}}" motion="{{motion}}" focus-outline="hidden">
  <dui-layer width="fill" height="fill">
    <dui-demo-arcade-chrome width="fill" height="fill" title="{{title}}" subtitle="{{subtitle}}" compact="{{compact}}" wide="{{wide}}" background="{{background}}" panel="{{panel}}" accent="{{accent}}" ink="{{ink}}" motion-label="{{motionLabel}}" size-label="{{sizeLabel}}" help-label="{{helpLabel}}" busy="{{busy}}" credits="{{credits}}" returned="{{returned}}" status="{{status}}" wager="{{wager}}" play-label="{{playLabel}}" play-locked="{{playLocked}}" less-locked="{{lessLocked}}" more-locked="{{moreLocked}}" />
    <dui-if test="{{playground}}">
      <dui-if test="{{wide}}">
        <dui-demo-prize-wheel id="wheel" x="18" y="45" width="162" height="162" a="{{a}}" b="{{b}}" duration="{{duration}}" />
        <dui-heading x="246" y="54" width="210" height="18" label="{{outcome}}" color="{{accent}}" />
        <dui-text x="246" y="198" width="216" height="9" label="EVERY SLICE IS A POSSIBILITY" color="{{ink}}" />
      </dui-if>
      <dui-if test="{{compact}}">
        <dui-demo-prize-wheel id="wheel" x="8" y="18" width="108" height="108" a="{{a}}" b="{{b}}" duration="{{duration}}" />
        <dui-text x="180" y="27" width="132" height="9" label="{{outcome}}" color="{{accent}}" />
      </dui-if>
      <dui-repeat items="prizes" as="prize">
        <dui-surface x="{{prize.x}}" y="{{prize.y}}" width="{{prize.width}}" height="18" fill="{{prize.colour}}" />
        <dui-text x="{{prize.x}}" y="{{prize.y}}" width="{{prize.width}}" height="9" label="{{prize.label}}" align="center" color="#FFFFFF" />
      </dui-repeat>
    </dui-if>
    <dui-if test="{{help}}">
      <dui-repeat items="rules" as="rule">
        <dui-if test="{{wide}}">
          <dui-text x="18" y="{{rule.wideY}}" width="444" height="9" label="{{rule.text}}" color="{{ink}}" />
        </dui-if>
        <dui-if test="{{compact}}">
          <dui-text x="10" y="{{rule.compactY}}" width="300" height="9" label="{{rule.text}}" color="{{ink}}" />
        </dui-if>
      </dui-repeat>
    </dui-if>
  </dui-layer>
</dui-menu>
