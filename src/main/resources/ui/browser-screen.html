<dui-video width="{{width}}" height="{{height}}" format="{{format}}" fps="{{fps}}" max-tiles="{{tiles}}" bytes-per-second="{{bytes}}" background="#080B11" scale="fit">
  <dui-hud native-hud="cover" native-hud-color="#080B11">
    <dui-surface anchor-y="top" offset-y="6" opacity="0.85"><dui-menu width="360" height="36"><dui-layer><dui-rect width="fill" height="fill" fill="#101722"/></dui-layer></dui-menu></dui-surface>
    <dui-surface anchor-y="top" offset-y="6"><dui-menu width="360" height="36"><dui-layer>
      <dui-text x="9" y="6" width="342" height="9" label="{{title}}" color="#FFF5F7"/>
      <dui-text x="9" y="24" width="342" height="9" label="{{url}}" color="#FFD0D8"/>
    </dui-layer></dui-menu></dui-surface>
    <dui-surface anchor-y="bottom" offset-y="-3" opacity="0.85"><dui-menu width="360" height="54"><dui-layer><dui-rect width="fill" height="fill" fill="#101722"/></dui-layer></dui-menu></dui-surface>
    <dui-surface anchor-y="bottom" offset-y="-3"><dui-menu width="360" height="54"><dui-layer>
      <dui-text x="9" y="6" width="342" height="9" label="Mouse move / Left click / Wheel scroll" color="#FFF5F7"/>
      <dui-text x="9" y="24" width="342" height="9" label="Right click = controls / WASD + Space backup" color="#FFD0D8"/>
      <dui-text x="9" y="42" width="342" height="9" label="{{status}} / Shift exit / F1 clean view" color="#AAB9CD"/>
    </dui-layer></dui-menu></dui-surface>
  </dui-hud>
</dui-video>
