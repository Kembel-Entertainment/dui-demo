name: dui-demo
version: 0.1.0-SNAPSHOT
main: gg.kembel.dui.demo.DuiDemoPlugin
api-version: '26.2'
website: https://kembel.gg
description: Work in progress examples for the embedded dui library
commands:
  dui:
    description: Explore the dui demo
    usage: /dui [components|setup|shop|rewards|advent|warps|poker|roulette|blackjack|slots|horses|wheel|coinflip|bookofra|videos|reload] [compact|spacious|refresh]
  uikit:
    description: Open the component catalogue
  uishop:
    description: Open the demo shop
  dailyrewards:
    description: Open the daily rewards demo
  advent:
    description: Open the animated 24-gift Advent playground
  warps:
    description: Open the animated Wayfarer warp atlas
  slots:
    description: Open the 777 demo arcade
  poker:
    description: Open the Velvet Holdem table (demo chips, three bots)
    usage: /poker [compact|spacious]
  roulette:
    description: Open the Riviera European roulette table (demo credits)
    usage: /roulette [compact|spacious]
  blackjack:
    description: Open the Monarch Blackjack table (demo credits)
    usage: /blackjack [compact|spacious]
  uivideos:
    description: Open runtime video thumbnails
  horses:
    description: Race four illustrated horses with demo credits
  horserace:
    description: Open Nightfall Derby
  pferderennen:
    description: Open Nightfall Derby
  wheel:
    description: Spin the Prism prize wheel with demo credits
  gluecksrad:
    description: Open the Prism prize wheel
  fortunewheel:
    description: Open the Prism prize wheel
  coinflip:
    description: Call heads or tails in Sun and Moon
  bookofra:
    description: Open Temple of Dawn, the original book adventure demo
  book:
    description: Open Temple of Dawn
  character:
    description: Open the Aster character sheet and equip inventory items
    usage: /character [compact|spacious|kit]
permissions:
  dui-demo.character-kit:
    default: op
  dui-demo.reload:
    default: op
