plugins { id 'java' }
group = 'gg.kembel.dui'
version = '0.3.0-SNAPSHOT'
repositories { mavenLocal(); mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }
configurations { packTools }
dependencies {
    implementation project(':platform-showcase')
    implementation project(':extension-proof')
    implementation 'gg.kembel.dui:dui-paper:0.3.0-SNAPSHOT'
    testImplementation 'gg.kembel.dui:dui-test:0.3.0-SNAPSHOT'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.google.zxing:core:3.5.4'
    packTools 'gg.kembel.dui:dui-pack:0.3.0-SNAPSHOT'
    compileOnly 'gg.kembel.dui:dui-pack:0.3.0-SNAPSHOT'
    compileOnly 'io.papermc.paper:paper-api:26.3.build.170-beta'
    testImplementation 'io.papermc.paper:paper-api:26.3.build.170-beta'
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
test { useJUnitPlatform() }
tasks.named('check'){dependsOn ':extension-proof:check'}
jar {
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'net/kyori/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('demoArt', JavaExec) {
 dependsOn classes; classpath=sourceSets.main.runtimeClasspath; mainClass='gg.kembel.dui.demo.DemoArt'
 args layout.buildDirectory.dir('pack-additions').get().asFile.absolutePath
}
tasks.register('buildPack', JavaExec) {
 dependsOn demoArt, configurations.packTools; classpath=sourceSets.main.runtimeClasspath + configurations.packTools; mainClass='gg.kembel.dui.demo.DemoPackGenerator'
 doFirst { if(!project.hasProperty('minecraftJar'))throw new GradleException('Pass -PminecraftJar=/path/to/verified/26.3-client.jar'); args project.property('minecraftJar'),layout.buildDirectory.dir('pack').get().asFile.absolutePath,layout.buildDirectory.dir('pack-additions').get().asFile.absolutePath }
}
tasks.register('installDemo', Exec) {
 dependsOn jar, buildPack
 doFirst { commandLine 'python3','scripts/demo.py','install','--plugin-jar',tasks.named('jar').get().archiveFile.get().asFile.absolutePath }
}

tasks.register('prepareDemo', Exec) {
 doFirst { def command=['python3','scripts/demo.py','prepare']; if(providers.gradleProperty('acceptEula').getOrElse('false')=='true')command+='--accept-eula'; commandLine command }
}
tasks.register('runDemo', Exec) {
 dependsOn prepareDemo, installDemo
 commandLine 'python3','scripts/demo.py','server'
 standardInput=System.in
}
tasks.register('e2e', Exec) {
 dependsOn prepareDemo, installDemo
 doFirst {
  def scenario=providers.gradleProperty('scenario').getOrElse('all')
  def args=['python3','scripts/demo.py','e2e','--scenario',scenario]
  if(project.hasProperty('liveVideos'))args+='--live-videos'
  commandLine args
 }
}

tasks.withType(Exec).configureEach { environment "JAVA_HOME",System.getProperty("java.home") }
tasks.named('jar') { from('LICENSE') { into 'META-INF/dui-demo' }; from('THIRD_PARTY_NOTICES.md') { into 'META-INF/dui-demo' } }

tasks.register('verifyShopScreenshots', JavaExec) {
 dependsOn testClasses
 classpath=sourceSets.test.runtimeClasspath
 mainClass='gg.kembel.dui.demo.ShopScreenshotCheck'
 args layout.buildDirectory.dir('reports/e2e/shop').get().asFile.absolutePath
}
